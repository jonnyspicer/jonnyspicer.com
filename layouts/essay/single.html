{{ define "main" }}
<article class="post post-essay">
    <h1 class="big-title">{{ .Title }}</h1>
    {{ partial "post-meta.html" . }}
    {{ partial "post-epistemics.html" . }}
    {{ partial "toc.html" . }}
    <div data-read-depth>
    {{ partial "content-images.html" .Content }}
    </div>

    {{ partial "related-posts.html" . }}
    {{ partial "backlinks.html" . }}
</article>
{{ end }}
