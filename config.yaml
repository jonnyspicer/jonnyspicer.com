baseURL: https://jonnyspicer.com
languageCode: en-GB
title: Jonny Spicer
defaultContentLanguage: en
disableHugoGeneratorInject: true
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true
summaryLength: 10
# Lastmod comes from explicit front matter only, falling back to the publish
# date. Git dates were misleading: bulk edits (e.g. the 2021 migration) made
# ~900 old posts claim the same "updated" date, which search engines treat as
# an unreliable sitemap signal. Add `lastmod:` to a post when you substantively
# revise it.
frontmatter:
  lastmod:
    - lastmod
    - date
services:
  rss:
    limit: 50
markup:
  goldmark:
    renderer:
      unsafe: true
taxonomies:
  category: categories
  series: series
  tags: tags
mediaTypes:
  application/javascript:
    suffixes:
      - js
outputFormats:
  js:
    mediaType: application/javascript
    baseName: navbar
    isPlainText: true
    notAlternative: true
permalinks:
  blog: /:section/:title
  essay: /:title
params:
  author: Jonny Spicer
  ogimage: "/img/og.png"
  github: https://github.com/jonnyspicer
  twitter: https://twitter.com/jjspicer
  sitename: Jonny Spicer
  # Profiles that are "the same person" as this site, used in the Person
  # JSON-LD (sameAs). Empty entries are skipped. Fill in / correct these.
  sameAs:
    - https://heresjonny.substack.com          # Substack (found on /about)
    - https://www.lesswrong.com/users/jonny-spicer  # LessWrong
    - https://twitter.com/jjspicer             # Twitter/X (from params.twitter; verify, or use https://x.com/<handle>)
    - https://github.com/jonnyspicer            # GitHub
    - https://www.linkedin.com/in/jonnyspicer   # LinkedIn (found on /about)
  personImage: "/img/profile.jpg"
  description: Jonny Spicer is a founder, software engineer, blogger, runner, climber and music lover, and this is his personal site
menu:
  main:
    - name: "Home"
      url: "/"
      weight: 1
    - name: "About"
      url: "/about"
      weight: 2
    # - name: "Garden"
    #   url: "/garden"
    #   weight: 3
    - name: "Blog"
      url: "/blog"
      weight: 4
    - name: "Contact"
      url: "/contact"
      weight: 5
server:
  headers:
    - for: /**
      values:
        Access-Control-Allow-Origin: "*"
